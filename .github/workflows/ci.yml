name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal -c clippy -c rustfmt
          rustup default 1.99.1
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
