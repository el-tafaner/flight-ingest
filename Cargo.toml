[package]
name = "flight-ingest"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Fetch and validate real-time flight data"
license = "MIT"
repository = "https://github.com/el-tafaner/flight-ingest"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util"] }
